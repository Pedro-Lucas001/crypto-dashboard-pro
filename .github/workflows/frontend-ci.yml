name: Validate frontend

on:
  push:
    branches:
      - main
      - feat/corporate-responsive-dashboard
      - feat/supabase-persistent-alerts
  pull_request:
    branches:
      - main
      - feat/corporate-responsive-dashboard

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-dashboard-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crypto-dashboard-pro/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck alert worker
        run: deno check supabase/functions/crypto-price-worker/index.ts
      - name: Test alert thresholds
        run: deno test supabase/functions/crypto-price-worker/alertRules.test.ts
